<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>С днём рождения, Лиза</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #FBEAF3; --floor-a: #F3DFC4; --floor-b: #E9CFAE;
    --surface: rgba(255,251,246,0.7); --surface-solid: #FFFBF6;
    --text-primary: #5B4A63; --text-muted: #9C8CA6;
    --accent-pink: #F6B8D2; --accent-peach: #F7D9A8;
    --accent-mint: #AEE3C9; --accent-lavender: #C9BCEA;
    --border-soft: rgba(91,74,99,0.16);
    --font-display: 'Righteous', sans-serif; --font-body: 'Karla', sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wall:#FBEAF3; --text-primary:#5B4A63; } }
  :root[data-theme="dark"] { --wall:#FBEAF3; --text-primary:#5B4A63; }

  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0; min-height: 100svh;
    background: linear-gradient(160deg, #FBEAF3 0%, #F5E9F5 100%);
    background-attachment: fixed; color: var(--text-primary); font-family: var(--font-body);
    line-height: 1.55; overflow-x: hidden;
  }
  img { max-width: 100%; } a, button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent-lavender); outline-offset: 3px; }

  .intro { text-align: center; padding: 72px 24px 32px; }
  .intro h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 0 0 14px; color: var(--accent-pink); text-shadow: 0 2px 0 rgba(91,74,99,.12); letter-spacing: 0.01em; }
  .intro p { max-width: 44ch; margin: 0 auto; color: var(--text-muted); font-size: clamp(1rem, 1.8vw, 1.15rem); }
  .intro .tip { margin-top: 10px; font-size: 0.95rem; color: var(--accent-lavender); font-weight: 700; }

  .scene-wrap { padding: 12px 24px 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .room-scroll { width: 100%; overflow-x: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
  .room {
    position: relative; width: 100%; min-width: 620px; max-width: 1000px; aspect-ratio: 3 / 2;
    margin: 0 auto; border-radius: 20px; overflow: hidden;
    background:
      radial-gradient(circle 2.5px at 20px 20px, rgba(246,184,210,0.28) 2px, transparent 3px),
      radial-gradient(circle 2.5px at 40px 40px, rgba(174,227,201,0.22) 2px, transparent 3px),
      linear-gradient(180deg, var(--wall) 0%, var(--wall) 62%, var(--floor-a) 62%, var(--floor-b) 100%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    box-shadow: 0 30px 60px -30px rgba(91,74,99,.4);
    border: 10px solid var(--surface-solid);
  }

  /* ---- decor ---- */
  .rug { position: absolute; left: 60%; top: 88%; transform: translate(-50%,-50%); width: 320px; height: 100px; border-radius: 50%;
    background: repeating-radial-gradient(circle, var(--accent-peach) 0 13px, var(--accent-pink) 13px 26px, var(--accent-mint) 26px 39px, var(--accent-lavender) 39px 52px);
    opacity: .8; box-shadow: 0 10px 24px -12px rgba(91,74,99,.35); z-index: 1; }

  .clock-btn { width: 72px; height: 72px; border-radius: 50%; background: var(--surface-solid); box-shadow: 0 0 0 5px var(--accent-pink), 0 8px 16px -8px rgba(91,74,99,.4); z-index: 4; }
  .clock-btn::before { content: ''; position: absolute; inset: -16px; border-radius: 50%; background: repeating-conic-gradient(var(--accent-peach) 0deg 9deg, transparent 9deg 27deg); opacity: .4; z-index: -1; }
  .clock-hand { position: absolute; left: 50%; bottom: 50%; width: 3px; background: var(--text-primary); border-radius: 2px; transform-origin: bottom center; }
  .clock-hand.hour { height: 16px; margin-left: -1.5px; }
  .clock-hand.minute { height: 24px; width: 2px; margin-left: -1px; background: var(--accent-pink); }
  .clock-toast { position: absolute; left: 11%; top: 2%; transform: translate(-10%,0) scale(.92); background: var(--surface-solid); color: var(--text-primary);
    padding: 8px 14px; border-radius: 12px; font-family: var(--font-display); font-weight: 400; font-size: .8rem; white-space: nowrap;
    box-shadow: 0 8px 16px -8px rgba(91,74,99,.35); opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease; z-index: 6; }
  .clock-toast.show { opacity: 1; transform: translate(-10%,-10px) scale(1); }

  /* ---- disco ball + rotating light beams ---- */
  .disco-line { position: absolute; left: 50%; top: 0; width: 2px; height: 8%; background: var(--text-muted); transform: translateX(-50%); z-index: 4; }
  .disco-ball { position: absolute; left: 50%; top: 8%; width: 58px; height: 58px; border-radius: 50%; transform: translate(-50%,0); z-index: 4;
    background: conic-gradient(from 0deg, #f3e6ee, #d9c3dd, #f3e6ee, #d9c3dd, #f3e6ee, #d9c3dd);
    box-shadow: inset -8px -8px 12px rgba(91,74,99,.3), 0 10px 16px -6px rgba(91,74,99,.4); animation: disco-spin 7s linear infinite; }
  .disco-ball::before { content:''; position:absolute; top:10%; left:16%; width:34%; height:24%; border-radius:50%; background: rgba(255,255,255,.6); filter: blur(2px); }
  @keyframes disco-spin { to { transform: translate(-50%,0) rotate(360deg); } }

  .disco-rays { position: absolute; left: 50%; top: 9.5%; width: 0; height: 0; pointer-events: none; z-index: 2;
    animation: rays-spin 14s linear infinite; }
  .ray-beam { position: absolute; left: -3px; top: 0; width: 6px; height: 640px; transform-origin: top center; opacity: .3; }
  @keyframes rays-spin { to { transform: rotate(360deg); } }

  /* ---- window with cityscape ---- */
  .window-frame { position: absolute; width: 160px; z-index: 3; }
  .window-glass { position: relative; width: 100%; height: 104px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 6px var(--surface-solid), 0 8px 16px -8px rgba(91,74,99,.35); }
  .window-glass::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--surface-solid); margin-left: -2px; z-index: 3; }
  .window-glass::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 4px; background: var(--surface-solid); margin-top: -2px; z-index: 3; }
  .sky { position: absolute; inset: 0; transition: background .6s ease; }
  .sky-body { position: absolute; border-radius: 50%; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #FFFDF6; opacity: .85; }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; }
  .skyline svg { width: 100%; height: 100%; display: block; }
  .window-arrow { position: absolute; top: 50%; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-solid); border: none;
    box-shadow: 0 3px 6px rgba(91,74,99,.3); cursor: pointer; font-size: 1rem; color: var(--text-primary); transform: translateY(-50%); }
  .window-arrow.left { left: -30px; } .window-arrow.right { right: -30px; }
  .window-label { margin-top: 8px; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: .8rem; color: var(--text-primary);
    background: var(--surface-solid); border-radius: 999px; padding: 4px 10px; box-shadow: 0 3px 6px rgba(91,74,99,.2); }

  /* ---- growing plant ---- */
  .plant-pot { position: absolute; width: 50px; }
  .plant-pot svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* ---- weather: seasonal particles ---- */
  .weather-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 7; }
  .weather-particle { position: absolute; top: -8%; border-radius: 50%; animation-timing-function: linear; animation-iteration-count: infinite; }
  .weather-particle.leaf { border-radius: 0 60% 0 60%; }
  .weather-particle.petal { border-radius: 100% 0 100% 0; }
  @keyframes weather-fall { 0% { top: -8%; opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } 100% { top: 106%; opacity: 0; } }
  @keyframes weather-rise { 0% { top: 106%; opacity: 0; } 12% { opacity: .8; } 88% { opacity: .8; } 100% { top: -8%; opacity: 0; } }
  @keyframes weather-sway { 0% { margin-left: -6px; } 100% { margin-left: 6px; } }

  /* ---- birthday countdown plaque ---- */
  .bday-countdown { position: absolute; background: var(--surface-solid); border-radius: 12px; padding: 7px 12px; font-family: var(--font-display);
    font-weight: 400; font-size: .7rem; color: var(--text-primary); box-shadow: 0 6px 12px -6px rgba(91,74,99,.3); text-align: center; line-height: 1.3; white-space: nowrap; z-index: 4; }

  /* ---- radio ---- */
  .radio-prop { width: 62px; height: 42px; z-index: 3; }
  .wall-shelf { position: absolute; width: 150px; height: 10px; z-index: 2; }
  .wall-shelf-plank { position: absolute; left: 0; right: 0; top: 0; height: 8px; border-radius: 5px; background: linear-gradient(160deg, #DFC094, #C6A275); box-shadow: 0 8px 14px -6px rgba(91,74,99,.4); }
  .wall-shelf-bracket { position: absolute; width: 4px; height: 12px; background: #B08F63; bottom: -12px; }
  .wall-shelf-bracket.l { left: 18%; } .wall-shelf-bracket.r { right: 18%; }
  .radio-body { position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(160deg, var(--accent-mint), #7FCBA8); box-shadow: 0 10px 16px -8px rgba(91,74,99,.5); }
  .radio-dial { position: absolute; left: 8px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface-solid); box-shadow: inset 0 0 0 2px var(--accent-lavender); }
  .radio-grill { position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; border-radius: 4px;
    background-image: radial-gradient(circle, var(--text-muted) 1.2px, transparent 1.4px); background-size: 6px 6px; opacity: .6; }
  .radio-antenna { position: absolute; right: 14px; top: -14px; width: 2px; height: 16px; background: var(--text-muted); transform: rotate(18deg); transform-origin: bottom center; }
  .radio-prop.playing .radio-dial { box-shadow: inset 0 0 0 2px var(--accent-pink); animation: orb-pulse 1.6s ease-in-out infinite; }

  /* ---- armchair with plush dino ---- */
  .armchair { position: absolute; width: 130px; height: 112px; z-index: 3; }
  .chair-back { position: absolute; left: 8%; right: 8%; top: 0; height: 58%; border-radius: 18px 18px 6px 6px; background: linear-gradient(160deg, var(--accent-lavender), #B9A2E6); box-shadow: 0 10px 20px -10px rgba(91,74,99,.35); }
  .chair-seat { position: absolute; left: 0; right: 0; bottom: 20%; height: 34%; border-radius: 14px; background: linear-gradient(160deg, var(--accent-lavender), #C7B4EE); box-shadow: 0 8px 16px -8px rgba(91,74,99,.3); }
  .chair-arm { position: absolute; bottom: 16%; width: 18px; height: 48%; border-radius: 10px; background: var(--accent-lavender); }
  .chair-arm.l { left: -3%; } .chair-arm.r { right: -3%; }
  .chair-leg { position: absolute; bottom: -14px; width: 8px; height: 16px; background: #C9A374; border-radius: 2px; }
  .chair-leg.l { left: 16%; } .chair-leg.r { right: 16%; }
  .chair-dino { position: absolute; left: 52%; top: -6%; transform: translateX(-50%); width: 92px; filter: drop-shadow(0 6px 6px rgba(91,74,99,.3)); border: none; background: none; padding: 0; cursor: pointer; }
  .chair-dino svg { display: block; width: 100%; height: auto; }
  .chair-dino .tongue { opacity: 0; transform: scaleY(0); transform-origin: 70px 64px; transition: transform .22s cubic-bezier(.3,1.6,.5,1), opacity .18s ease; }
  .chair-dino.tongue-out .tongue { opacity: 1; transform: scaleY(1); }
  .chair-dino.bop { animation: dino-bop .4s ease; }
  @keyframes dino-bop { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.08,0.92); } 100% { transform: translateX(-50%) scale(1); } }
  .chair-pillow { position: absolute; left: 16%; top: 34%; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-pink);
    box-shadow: 15px 3px 0 -2px var(--accent-pink), -12px 5px 0 -3px var(--accent-pink), 3px -9px 0 -4px var(--accent-pink), 7px 9px 0 -3px var(--accent-pink); }

  /* ---- shared prop button reset ---- */
  .prop { position: absolute; border: none; padding: 0; cursor: pointer; background: none; }
  .prop:hover { filter: brightness(1.06); }

  /* ---- contact shadow, reused under standalone props ---- */
  .floor-shadow { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); width: 68%; height: 10px; border-radius: 50%;
    background: rgba(91,74,99,.26); filter: blur(4px); z-index: -1; pointer-events: none; }
  .floor-shadow.big { width: 84%; height: 14px; bottom: -16px; }

  /* ---- congratulations: stacked, draggable boxes ---- */
  .gift-prop { width: 70px; height: 80px; touch-action: none; z-index: 5; }
  .gift-prop .box-lid { position: absolute; left: -6%; right: -6%; top: 0; height: 26%; border-radius: 6px; background: var(--box-color); filter: brightness(0.86); box-shadow: 0 3px 6px rgba(91,74,99,.25); }
  .gift-prop .box-body { position: absolute; left: 0; right: 0; top: 22%; bottom: 0; border-radius: 0 0 10px 10px; background: var(--box-color); box-shadow: 0 10px 18px -10px rgba(91,74,99,.5); }
  .gift-prop .ribbon-v { position: absolute; top: 0; bottom: 0; left: 50%; width: 10px; margin-left: -5px; background: rgba(255,255,255,.85); z-index: 2; }
  .gift-prop .ribbon-h { position: absolute; left: 0; right: 0; top: 22%; height: 9px; background: rgba(255,255,255,.85); z-index: 2; }
  .gift-prop .bow { position: absolute; left: 50%; top: -15px; transform: translateX(-50%); font-size: 1.5rem; z-index: 3; }
  .gift-prop.opened { opacity: .55; }
  .gift-prop.dragging { filter: brightness(1.1); cursor: grabbing; }
  .gift-prop.pop { animation: prop-pop .4s ease; }
  @keyframes prop-pop {
    0% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1); }
    50% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.18); }
    100% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1); }
  }

  /* ---- table + cake ---- */
  .table-top { position: absolute; left: 60%; top: 80%; transform: translate(-50%,-50%); width: 270px; height: 30px; border-radius: 14px; z-index: 2;
    background: linear-gradient(160deg, #DFC094, #C6A275); box-shadow: 0 16px 24px -10px rgba(91,74,99,.45); }
  .table-top::before { content: ''; position: absolute; inset: 4px 12px; border-radius: 9px; background-image: repeating-linear-gradient(90deg, var(--accent-peach) 0 16px, var(--surface-solid) 16px 32px); opacity: .6; }
  .table-top::after { content: ''; position: absolute; left: 2%; right: 2%; top: -3px; height: 5px; border-radius: 6px; background: rgba(255,255,255,.55); }
  .table-cloth { position: absolute; left: 60%; top: 81%; transform: translate(-50%,0); width: 210px; height: 46px;
    background: linear-gradient(180deg, var(--accent-pink), var(--accent-peach)); clip-path: polygon(4% 0%, 96% 0%, 88% 100%, 12% 100%);
    opacity: .92; box-shadow: inset 0 8px 10px -6px rgba(91,74,99,.2); z-index: 1; }
  .table-leg { position: absolute; top: 90%; width: 8px; height: 40px; background: #B08F63; border-radius: 3px; z-index: 1; }
  .table-leg.l { left: 47%; } .table-leg.r { left: 73%; }

  .cake { position: absolute; left: 60%; top: 77.5%; transform: translate(-50%, -100%); width: 150px; z-index: 3; }
  .candles { position: absolute; top: -40px; left: 0; right: 0; height: 40px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; }
  .candle { position: relative; width: 6px; height: 100%; background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; }
  .candle .stick { width: 6px; height: 30px; border-radius: 2px; background: linear-gradient(var(--accent-lavender), var(--accent-mint)); }
  .candle .flame { width: 10px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); transform-origin: bottom center; margin-bottom: -2px;
    background: radial-gradient(circle at 30% 30%, #FFF3C4, var(--accent-peach) 55%, var(--accent-pink) 100%); animation: flicker 1.3s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { transform: rotate(-45deg) scale(1); } 50% { transform: rotate(-38deg) scale(0.9,1.08); } }
  .candle.out .flame { animation: none; opacity: 0; transform: rotate(-45deg) scale(0.2); transition: opacity .4s ease, transform .4s ease; }
  .candle .smoke { position: absolute; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: rgba(140,130,150,.4); opacity: 0; }
  .candle.out .smoke { animation: smoke-puff 1s ease-out forwards; }
  @keyframes smoke-puff { 0% { opacity:.6; transform:translateY(0) scale(1);} 100% { opacity:0; transform:translateY(-22px) scale(2.4);} }

  .tier { border-radius: 16px; position: relative; }
  .tier.bottom { height: 66px; background: linear-gradient(160deg, var(--accent-pink), #FAD0E4); }
  .tier.top { width: 64%; margin: -6px auto 0; height: 44px; background: linear-gradient(160deg, var(--accent-peach), #FBE7C4); border-radius: 14px; }
  .frosting { position: absolute; top: -10px; left: 0; right: 0; height: 18px; background-image: radial-gradient(circle at 9px 9px, var(--surface-solid) 7px, transparent 8px); background-size: 18px 18px; background-repeat: repeat-x; }
  .plate { width: 112%; margin-left: -6%; height: 12px; border-radius: 50%; background: var(--surface-solid); box-shadow: 0 8px 16px -6px rgba(91,74,99,.4); margin-top: 4px; }
  .cake-shadow { position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); width: 78%; height: 10px; border-radius: 50%; background: rgba(91,74,99,.28); filter: blur(3px); z-index: -1; }

  /* ---- camera ---- */
  .camera { width: 96px; height: 74px; z-index: 4; }
  .cam-body { position: absolute; left: 4px; right: 4px; bottom: 10px; top: 20px; background: linear-gradient(160deg, var(--accent-pink), #E48FB5); border-radius: 10px; box-shadow: 0 10px 18px -10px rgba(91,74,99,.5); }
  .cam-body::after { content:''; position:absolute; left:0; right:0; bottom:0; height: 40%; background: var(--text-primary); opacity:.8; border-radius: 0 0 10px 10px; }
  .cam-lens { position: absolute; left: 50%; top: 44%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #eef4ff, var(--accent-lavender) 60%, #6a5a99 100%); box-shadow: 0 0 0 4px var(--surface-solid); z-index: 1; }
  .cam-flash-cube { position: absolute; left: 50%; top: -6px; width: 26px; height: 16px; margin-left: -13px; border-radius: 4px; background: var(--accent-peach); box-shadow: 0 4px 8px -3px rgba(91,74,99,.4); }
  .cam-strap { position: absolute; left: -4px; top: 6px; width: 10px; height: 3px; background: var(--text-muted); border-radius: 2px; }

  /* ---- prediction cabinet ---- */
  .fortune-cabinet { position: absolute; width: 100px; height: 116px; border-radius: 12px 12px 6px 6px; background: linear-gradient(160deg, var(--accent-lavender), #9784CF); box-shadow: 0 14px 22px -12px rgba(91,74,99,.5); z-index: 4; }
  .fortune-window { position: absolute; left: 50%; top: 20%; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0%, var(--accent-peach) 45%, var(--accent-pink) 100%); box-shadow: inset 0 0 12px rgba(91,74,99,.3); }
  .fortune-glow { position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, rgba(247,217,168,.5), transparent 70%); opacity: .6; animation: orb-pulse 3s ease-in-out infinite; pointer-events: none; }
  @keyframes orb-pulse { 0%,100% { transform: scale(1); opacity:.5; } 50% { transform: scale(1.18); opacity:.9; } }
  .fortune-cabinet.active .fortune-window { animation: orb-shake .5s ease; }
  @keyframes orb-shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .fortune-label { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 400; font-size: .62rem; color: var(--surface-solid); letter-spacing: .01em; }
  .fortune-knob { position: absolute; bottom: 26%; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-peach); }
  .fortune-knob.l { left: 12%; } .fortune-knob.r { right: 12%; }

  .blow-all { border: 1px solid var(--border-soft); border-radius: 999px; padding: 12px 24px; background: var(--surface); color: var(--text-primary); font-weight: 700; cursor: pointer; }
  .blow-all:hover { transform: translateY(-2px); }

  .flash-overlay { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 400; }
  .flash-overlay.flash { animation: flash-anim .35s ease; }
  @keyframes flash-anim { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: 0; } }
  #confetti-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 150; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(91,74,99,.45); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 300; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-card { position: relative; background: var(--surface-solid); border-radius: 18px; padding: 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 30px 60px -20px rgba(91,74,99,.4); transform: scale(.9); transition: transform .3s ease, max-width .2s ease; border: 6px solid var(--wall); max-height: 88vh; overflow-y: auto; }
  .modal-card.wide { max-width: 660px; }
  .modal-overlay.show .modal-card { transform: scale(1); }
  .modal-close { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; line-height: 1; padding: 6px; }
  .modal-card h3 { font-family: var(--font-display); font-weight: 400; margin: 0 0 12px; font-size: 1.3rem; color: var(--accent-pink); }

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const room = document.getElementById('room');
  const roomScroll = document.getElementById('room-scroll');
  const swipeHint = document.getElementById('swipe-hint');
  if (roomScroll && swipeHint) {
    roomScroll.addEventListener('scroll', () => swipeHint.classList.add('hide'), { once: true });
  }
  const today = new Date();

  // ---------- сезон: погода за окном и в комнате ----------
  function getSeason(month) {
    if (month === 11 || month === 0 || month === 1) return 'winter';
    if (month >= 2 && month <= 4) return 'spring';
    if (month >= 5 && month <= 7) return 'summer';
    return 'autumn';
  }
  const seasonConfigs = {
    winter: { count: 22, colors: ['#FFFFFF', '#F3F0FA'], shape: 'circle', size: [3, 5], behavior: 'fall', duration: [9, 16] },
    spring: { count: 16, colors: ['#F6B8D2', '#FFFDF6', '#C9BCEA'], shape: 'petal', size: [5, 8], duration: [10, 18], behavior: 'fall' },
    summer: { count: 14, colors: ['#F7D9A8', '#FFE9BC'], shape: 'circle', size: [2, 4], duration: [7, 13], behavior: 'rise' },
    autumn: { count: 16, colors: ['#D2622E', '#E8A93A', '#7C8B4A'], shape: 'leaf', size: [6, 9], duration: [9, 15], behavior: 'fall' }
  };
  const season = getSeason(today.getMonth());
  if (!reduceMotion) {
    const cfg = seasonConfigs[season];
    const layer = document.getElementById('weather-layer');
    for (let i = 0; i < cfg.count; i++) {
      const p = document.createElement('div');
      p.className = 'weather-particle ' + cfg.shape;
      const size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
      p.style.width = size + 'px'; p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
      if (cfg.shape === 'petal' || cfg.shape === 'leaf') p.style.transform = `rotate(${Math.random() * 360}deg)`;
      const dur = cfg.duration[0] + Math.random() * (cfg.duration[1] - cfg.duration[0]);
      const delay = -Math.random() * dur;
      const swayDur = 2 + Math.random() * 2;
      p.style.animation = `${cfg.behavior === 'rise' ? 'weather-rise' : 'weather-fall'} ${dur}s linear infinite ${delay}s, weather-sway ${swayDur}s ease-in-out infinite alternate`;
      layer.appendChild(p);
    }
  }

  // ---------- обратный отсчёт до дня рождения (12 сентября) ----------
  function ruDays(n) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'день';
    if ([2, 3, 4].includes(mod10) && ![12, 13, 14].includes(mod100)) return 'дня';
    return 'дней';
  }
  (function renderCountdown() {
    const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let target = new Date(t0.getFullYear(), 8, 12);
    if (target < t0) target = new Date(t0.getFullYear() + 1, 8, 12);
    const diff = Math.round((target - t0) / 86400000);
    const el = document.getElementById('bday-countdown');
    el.textContent = diff === 0 ? '🎂 сегодня!' : `🎂 др через ${diff} ${ruDays(diff)}`;
  })();

  // ---------- растение на подоконнике: растёт раз в день ----------
  (function renderPlant() {
    const key = 'liza-room-plant';
    const todayStr = today.toISOString().slice(0, 10);
    let stage = 0;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (saved && saved.lastDate === todayStr) {
        stage = saved.stage;
      } else {
        stage = saved ? Math.min(saved.stage + 1, 5) : 0;
        localStorage.setItem(key, JSON.stringify({ stage, lastDate: todayStr }));
      }
    } catch (e) {}

    const stemHeights = [0, 8, 16, 24, 30, 34];
    const leafCounts = [0, 1, 2, 3, 3, 4];
    const h = stemHeights[stage], leaves = leafCounts[stage];
    let leavesSvg = '';
    for (let i = 0; i < leaves; i++) {
      const y = 46 - (h / leaves) * (i + 0.6);
      const side = i % 2 === 0 ? 1 : -1;
      leavesSvg += `<ellipse cx="${20 + side * 7}" cy="${y}" rx="7" ry="4" fill="var(--accent-mint)" transform="rotate(${side * 30} ${20 + side * 7} ${y})"/>`;
    }
    const flowerSvg = stage >= 5
      ? `<circle cx="20" cy="${46 - h}" r="3" fill="var(--accent-peach)"/>
         <circle cx="16" cy="${46 - h - 3}" r="3" fill="var(--accent-pink)"/>
         <circle cx="24" cy="${46 - h - 3}" r="3" fill="var(--accent-pink)"/>
         <circle cx="20" cy="${46 - h - 6}" r="3" fill="var(--accent-pink)"/>
         <circle cx="20" cy="${46 - h - 2}" r="2" fill="#FFFDF6"/>`
      : '';
    document.getElementById('plant-pot').innerHTML = `

        <path d="M10 40 L30 40 L27 50 L13 50 Z" fill="var(--accent-peach)"/>
        <ellipse cx="20" cy="40" rx="10" ry="2.4" fill="#7C6650"/>
        ${h > 0 ? `<line x1="20" y1="40" x2="20" y2="${46 - h}" stroke="var(--accent-mint)" stroke-width="2.4" stroke-linecap="round"/>` : ''}
        ${leavesSvg}
        ${flowerSvg}

  })();

        <rect x="74" y="16" width="12" height="13" fill="#F6EEDD"/>
        <line x1="80" y1="16" x2="80" y2="3" stroke="#F6EEDD" stroke-width="1.6"/>` },
    { name: 'Сидней', sky: 'linear-gradient(180deg, #A8D8E0 0%, #BFE3DD 45%, #CDEAE0 75%, #F3E3B8 100%)',
      body: { top: 10, left: 66, size: 22, color: 'radial-gradient(circle, #FFF3E4, #F6C98A)' },
      landmark: `
        <rect x="8" y="48" width="6" height="16" fill="#8C99A6"/>
        <rect x="146" y="48" width="6" height="16" fill="#8C99A6"/>
        <path d="M11 50 Q80 12 149 50" stroke="#8C99A6" stroke-width="3" fill="none"/>
        <line x1="11" y1="50" x2="149" y2="50" stroke="#8C99A6" stroke-width="2"/>
        <line x1="40" y1="50" x2="40" y2="36" stroke="#8C99A6" stroke-width="1.2"/>
        <line x1="70" y1="50" x2="70" y2="22" stroke="#8C99A6" stroke-width="1.2"/>
        <line x1="100" y1="50" x2="100" y2="24" stroke="#8C99A6" stroke-width="1.2"/>
        <line x1="120" y1="50" x2="120" y2="38" stroke="#8C99A6" stroke-width="1.2"/>
        <rect x="86" y="58" width="44" height="6" fill="#F6EEDD"/>
        <path d="M92 60 Q95 36 106 26 Q110 42 106 60 Z" fill="#FFFDF6" stroke="#D9CFAE" stroke-width=".6"/>
        <path d="M103 60 Q107 32 119 20 Q125 40 117 60 Z" fill="#F6EEDD" stroke="#D9CFAE" stroke-width=".6"/>
        <path d="M115 60 Q120 42 130 34 Q134 48 126 60 Z" fill="#FFFDF6" stroke="#D9CFAE" stroke-width=".6"/>` }
  ];
  let cityIndex = 0;

  function renderCity() {
    const c = cities[cityIndex];
    const skyContainer = document.getElementById('window-sky');
    skyContainer.style.background = c.sky;
    skyContainer.querySelectorAll('.sky-body, .star').forEach(el => el.remove());

    const body = document.createElement('div');
    body.className = 'sky-body';
    body.style.top = c.body.top + '%'; body.style.left = c.body.left + '%';
    body.style.width = c.body.size + 'px'; body.style.height = c.body.size + 'px';
    body.style.background = c.body.color;
    body.style.opacity = '.9';
    skyContainer.appendChild(body);

    if (c.night) {
      for (let i = 0; i < 14; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.top = (Math.random() * 55) + '%';
        star.style.left = (Math.random() * 100) + '%';
        skyContainer.appendChild(star);
      }
    }

    const skyEl = document.getElementById('window-skyline');
    skyEl.innerHTML = `<svg viewBox="0 0 160 64" xmlns="http://www.w3.org/2000/svg">${c.landmark}</svg>`;
    document.getElementById('window-label').textContent = c.name;
  }
  document.getElementById('win-prev').addEventListener('click', () => { cityIndex = (cityIndex - 1 + cities.length) % cities.length; renderCity(); });
  document.getElementById('win-next').addEventListener('click', () => { cityIndex = (cityIndex + 1) % cities.length; renderCity(); });
  renderCity();

  // ---------- модалка ----------
  const overlay = document.getElementById('modal-overlay');
  const modalContent = document.getElementById('modal-content');
  const modalCard = document.getElementById('modal-card');
  function openModal(html, wide) { modalContent.innerHTML = html; modalCard.classList.toggle('wide', !!wide); overlay.classList.add('show'); }
  function closeModal() {
    overlay.classList.remove('show');
    stopStream();
    const vid = modalContent.querySelector('video');
    if (vid) { vid.pause(); vid.currentTime = 0; }
    const frame = modalContent.querySelector('iframe');
    if (frame) frame.src = frame.src;
    modalCard.classList.remove('wide');
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ---------- поздравления: аккуратный штабель, видео вместо текста, можно двигать ----------
  const gifts = [
    { name: 'Алина Батталова', video: 'videos/alina.mp4', color: 'var(--accent-pink)', left: 5, top: 85, rot: -2 },
    { name: 'Даша Демидовская', video: 'videos/dasha.mp4', color: 'var(--accent-lavender)', left: 12, top: 85, rot: 1 },
    { name: 'Дима Кружаев', video: 'videos/dima.mp4', color: 'var(--accent-mint)', left: 19, top: 85, rot: -1 },
    { name: 'Ира Холопова', video: 'videos/ira.mp4', color: 'var(--accent-peach)', left: 26, top: 85, rot: 2 },
    { name: 'Катя Лягина', video: 'videos/katya.mp4', color: 'var(--accent-pink)', left: 8, top: 69, rot: 1 },
    { name: 'Маша Фисейская', video: 'videos/masha.mp4', color: 'var(--accent-lavender)', left: 15, top: 69, rot: -1 },
    { name: 'Моника Кобалия', video: 'videos/monika.mp4', color: 'var(--accent-mint)', left: 22, top: 69, rot: 0 },
    { name: 'Настя Неткачева', video: 'videos/nastya.mp4', color: 'var(--accent-peach)', left: 11, top: 53, rot: 1 },
    { name: 'Света Бушуева', video: 'videos/sveta.mp4', color: 'var(--accent-pink)', left: 19, top: 53, rot: -1 }
  ];

  const pile = document.getElementById('gift-pile');
  let dragZ = 10;

  gifts.forEach((g, i) => {
    const btn = document.createElement('button');
    btn.className = 'prop gift-prop';
    btn.style.left = g.left + '%';
    btn.style.top = g.top + '%';
    btn.style.setProperty('--rot', g.rot + 'deg');
    btn.style.setProperty('--box-color', g.color);
    btn.style.transform = `translate(-50%,-50%) rotate(${g.rot}deg)`;
    btn.style.zIndex = i + 1;
    btn.setAttribute('aria-label', 'Открыть видео-поздравление от ' + g.name);
    btn.innerHTML = '<span class="box-lid"></span><span class="box-body"></span><span class="ribbon-v"></span><span class="ribbon-h"></span><span class="bow">🎀</span>';

    let dragging = false, moved = false, startX = 0, startY = 0, origLeft = g.left, origTop = g.top;

    btn.addEventListener('pointerdown', e => {
      dragging = true; moved = false;
      btn.setPointerCapture(e.pointerId);
      btn.classList.add('dragging');
      startX = e.clientX; startY = e.clientY;
      origLeft = parseFloat(btn.style.left); origTop = parseFloat(btn.style.top);
      dragZ++; btn.style.zIndex = dragZ;
    });
    btn.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      const rect = room.getBoundingClientRect();
      let newLeft = origLeft + (dx / rect.width) * 100;
      let newTop = origTop + (dy / rect.height) * 100;
      newLeft = Math.max(3, Math.min(97, newLeft));
      newTop = Math.max(3, Math.min(97, newTop));
      btn.style.left = newLeft + '%'; btn.style.top = newTop + '%';
    });
    btn.addEventListener('pointerup', e => {
      dragging = false; btn.classList.remove('dragging');
      try { btn.releasePointerCapture(e.pointerId); } catch (err) {}
      if (!moved) {
        btn.classList.add('opened');
        btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
        openModal(`<h3>${g.name}</h3><video src="${g.video}" controls autoplay playsinline style="width:100%;border-radius:10px;background:#000;"></video>`);
      }
    });

    pile.appendChild(btn);
  });

  // ---------- фотоаппарат ----------
  const flashOverlay = document.getElementById('flash-overlay');
  const captions = [
    'с днём рождения тебе', 'команда рядом, даже если не поместилась в кадр',
    'главное лицо сегодняшнего дня', 'снято с любовью', 'легенда команды в кадре'
  ];
  let currentStream = null;
  function stopStream() { if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; } }

  async function openCamera() {
    openModal(`<h3>Видоискатель</h3><p>Запрашиваем доступ к камере...</p>`);
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      currentStream = stream;
      openModal(`<h3>Улыбнись</h3>
        <video id="cam-video" autoplay playsinline muted></video>
        <div class="modal-actions"><button class="primary" id="capture-btn">снять</button></div>`);
      const video = document.getElementById('cam-video');
      video.srcObject = stream;
      document.getElementById('capture-btn').addEventListener('click', capturePhoto);
    } catch (err) { simulatePhoto(); }
  }

  function capturePhoto() {
    const video = document.getElementById('cam-video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 480; canvas.height = video.videoHeight || 600;
    const ictx = canvas.getContext('2d');
    ictx.translate(canvas.width, 0); ictx.scale(-1, 1);
    ictx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/png');
    stopStream();
    flashOverlay.classList.remove('flash'); void flashOverlay.offsetWidth; flashOverlay.classList.add('flash');
    const caption = captions[Math.floor(Math.random() * captions.length)];
    openModal(`<div class="polaroid" style="background-image:url('${dataUrl}');background-size:cover;background-position:center;"></div>
      <p>${caption}</p>
      <div class="modal-actions">
        <button class="secondary" id="retake-btn">переснять</button>
        <a class="primary" id="download-btn" href="${dataUrl}" download="liza-photo.png">скачать</a>
      </div>`);
    document.getElementById('retake-btn').addEventListener('click', openCamera);
  }

  function simulatePhoto() {
    flashOverlay.classList.remove('flash'); void flashOverlay.offsetWidth; flashOverlay.classList.add('flash');
    const caption = captions[Math.floor(Math.random() * captions.length)];
    openModal(`<div class="polaroid">📸✨🎉</div><p>${caption}</p>
      <div class="modal-actions"><button class="secondary" id="retake-btn">ещё снимок</button></div>`);
    document.getElementById('retake-btn').addEventListener('click', openCamera);
  }

  document.getElementById('camera-btn').addEventListener('click', openCamera);

  // ---------- предсказание: отдых, большие дела, путешествия ----------
  const fortunes = [
    'Этим летом обязательно будет город, в который давно хотелось, но всё не находилось повода',
    'Пора наконец выключить телефон на целые выходные — и мир не рухнет',
    'Один билет в один конец приведёт к лучшей идее года',
    'Ты возьмёшься за то самое большое дело, которое казалось слишком масштабным ещё в январе',
    'Где-то далеко тебя ждёт вид, ради которого стоит проснуться в пять утра',
    'Отпуск в этом году будет длиннее, чем ты обычно себе разрешаешь',
    'Случится путешествие, после которого захочется переставить мебель дома',
    'Ты наконец доделаешь тот масштабный проект для себя, а не для работы',
    'Будет утро без будильника, которое запомнится на весь год',
    'Новая страна на карте — и совсем новый взгляд на привычные вещи'
  ];
  const orbBtn = document.getElementById('orb-btn');
  function dayOfYear(d) {
    const start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }
  function askOrb() {
    orbBtn.classList.remove('active'); void orbBtn.offsetWidth; orbBtn.classList.add('active');
    const idx = dayOfYear(today) % fortunes.length;
    const dateStr = today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    setTimeout(() => {
      openModal(`<h3>Предсказание на ${dateStr}</h3><p id="fortune-text"></p>
        <p style="margin-top:14px; color: var(--text-muted); font-size:.85rem;">новое появится завтра</p>`);
      typewrite(document.getElementById('fortune-text'), fortunes[idx]);
    }, reduceMotion ? 0 : 450);
  }
  orbBtn.addEventListener('click', askOrb);

  function typewrite(el, text) {
    let i = 0; const speed = reduceMotion ? 0 : 22;
    function step() { if (i <= text.length) { el.textContent = text.slice(0, i); i++; if (speed > 0) setTimeout(step, speed); else step(); } }
    step();
  }

  // ---------- торт со свечами ----------
  const candlesWrap = document.getElementById('candles');
  const candleCount = 5;
  let litCount = candleCount;
  let celebrated = false;
  for (let i = 0; i < candleCount; i++) {
    const btn = document.createElement('button');
    btn.className = 'candle';
    btn.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-label', 'задуть свечу');
    btn.innerHTML = '<span class="flame"></span><span class="smoke"></span><span class="stick"></span>';
    btn.addEventListener('click', () => extinguish(btn));
    candlesWrap.appendChild(btn);
  }
  function extinguish(btn) {
    if (btn.classList.contains('out')) return;
    btn.classList.add('out'); btn.setAttribute('aria-pressed', 'true');
    litCount--; if (litCount <= 0) celebrate();
  }
  document.getElementById('blow-all-btn').addEventListener('click', () => {
    const remaining = candlesWrap.querySelectorAll('.candle:not(.out)');
    remaining.forEach((c, i) => setTimeout(() => extinguish(c), i * 150));
  });
  function celebrate() {
    if (celebrated) return; celebrated = true;
    launchConfetti();
    setTimeout(() => { openModal(`<h3>Загадала?</h3><p>Спасибо, что рядом. С днём рождения, Лиза — оставайся такой же смелой к будущему.</p>`); }, 500);
  }

  // ---------- конфетти ----------
  const confettiCanvas = document.getElementById('confetti-canvas');
  const cctx = confettiCanvas.getContext('2d');
  let confettiPieces = []; let confettiRunning = false;
  function sizeConfettiCanvas() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
  window.addEventListener('resize', sizeConfettiCanvas); sizeConfettiCanvas();
  const confettiColors = ['#F6B8D2', '#C9BCEA', '#AEE3C9', '#F7D9A8'];
  function launchConfetti() {
    confettiPieces = Array.from({ length: reduceMotion ? 0 : 160 }, () => ({
      x: Math.random() * confettiCanvas.width, y: -20 - Math.random() * confettiCanvas.height * 0.4,
      w: Math.random() * 6 + 4, h: Math.random() * 10 + 6, speed: Math.random() * 2 + 1.5,
      drift: (Math.random() - 0.5) * 1.2, rot: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 0.15,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)]
    }));
    confettiRunning = true; animateConfetti();
  }
  function animateConfetti() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let anyVisible = false;
    confettiPieces.forEach(p => {
      p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
      if (p.y < confettiCanvas.height + 20) anyVisible = true;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.fillStyle = p.color; cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cctx.restore();
    });
    if (anyVisible && confettiRunning) requestAnimationFrame(animateConfetti);
    else cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }
</script>
</body>
</html>
