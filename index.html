<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>С днём рождения, Лиза</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #FFF6D6; --wall-deep: #D7E8EF; --floor-a: #E3C989; --floor-b: #C7A968;
    --surface: rgba(255,252,240,0.75); --surface-solid: #FFFCF0;
    --text-primary: #591427; --text-muted: #9C7480;
    --accent-pink: #7A2B3D; --accent-peach: #E8C888;
    --accent-mint: #A9C4CE; --accent-lavender: #C1DBE8;
    --accent-wine: #591427;
    --plant-green: #7C9A5E;
    --border-soft: rgba(89,20,39,0.18);
    --font-display: 'Jost', sans-serif; --font-body: 'Jost', sans-serif; --font-serif: 'Cormorant Garamond', serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wall:#EFE9DC; --text-primary:#35302A; } }
  :root[data-theme="dark"] { --wall:#EFE9DC; --text-primary:#35302A; }

  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0; min-height: 100svh;
    background: linear-gradient(160deg, #FFF6D6 0%, #FDF0D0 100%);
    background-attachment: fixed; color: var(--text-primary); font-family: var(--font-body);
    line-height: 1.55; overflow-x: hidden;
  }
  img { max-width: 100%; } a, button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent-lavender); outline-offset: 3px; }

  .intro { text-align: center; padding: 72px 24px 32px; }
  .intro h1 { font-family: var(--font-serif); font-style: italic; font-weight: 600; font-size: clamp(2.4rem, 6.4vw, 4rem); margin: 0 0 14px; color: var(--text-primary); letter-spacing: 0.01em; }
  .intro p { max-width: 44ch; margin: 0 auto; color: var(--text-muted); font-size: clamp(1rem, 1.8vw, 1.15rem); }
  .intro .tip { margin-top: 10px; font-size: 0.85rem; color: var(--accent-pink); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }

  .scene-wrap { padding: 12px 24px 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .room-scroll { width: 100%; overflow-x: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
  .room {
    position: relative; width: 100%; min-width: 620px; max-width: 1000px; aspect-ratio: 3 / 2;
    margin: 0 auto; border-radius: 6px; overflow: hidden;
    background: var(--wall);
    box-shadow: 0 30px 60px -30px rgba(53,48,42,.4);
    border: 2px solid var(--text-primary);
    outline: 2px solid var(--accent-peach); outline-offset: 5px;
  }

  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; z-index: 0;
    background-color: var(--floor-a);
    background-image:
      linear-gradient(rgba(53,48,42,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(53,48,42,.08) 1px, transparent 1px),
      linear-gradient(180deg, var(--floor-a), var(--floor-b));
    background-size: 60px 60px, 60px 60px, 100% 100%;
  }
  .wainscot { position: absolute; left: 0; right: 0; top: 44%; height: 18%; z-index: 0; background: var(--wall-deep);
    background-image: repeating-linear-gradient(90deg, rgba(53,48,42,.1) 0 2px, transparent 2px 58px); }
  .crown { position: absolute; left: 0; right: 0; top: 0; height: 9px; background: linear-gradient(180deg, var(--accent-peach), #C7A968); box-shadow: 0 2px 4px rgba(53,48,42,.3); z-index: 0; }
  .rail { position: absolute; left: 0; right: 0; height: 3px; background: var(--accent-peach); box-shadow: 0 1px 3px rgba(53,48,42,.35); z-index: 0; }
  .rail.top { top: 44%; } .rail.bottom { top: 62%; }

  /* ---- decor ---- */
  .rug { position: absolute; left: 44%; top: 70%; transform: translate(-50%,-50%); width: 260px; height: 82px; border-radius: 50%;
    background-color: var(--accent-lavender);
    background-image: repeating-conic-gradient(var(--accent-pink) 0% 25%, transparent 0% 50%);
    background-size: 34px 34px;
    box-shadow: 0 0 0 6px var(--accent-peach) inset, 0 10px 24px -12px rgba(53,48,42,.4);
    opacity: .95; z-index: 1; }
  .rug-small { position: absolute; width: 130px; height: 46px; border-radius: 14px; background: var(--accent-mint);
    box-shadow: 0 0 0 4px var(--accent-peach) inset, 0 8px 16px -8px rgba(53,48,42,.35); opacity: .9; z-index: 1; }

  /* ---- french bulldog on the rug ---- */
  .dog-prop { width: 92px; z-index: 2; border: none; background: none; padding: 0; cursor: pointer; transition: left 1s cubic-bezier(.3,.7,.4,1); }
  .dog-prop svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 5px rgba(53,48,42,.3)); }
  .dog-prop.bop { animation: dog-bop .45s ease; }
  @keyframes dog-bop {
    0%   { transform: translate(-50%,-50%) scale(1,1); }
    35%  { transform: translate(-50%,-50%) scale(1.08,0.92); }
    100% { transform: translate(-50%,-50%) scale(1,1); }
  }
  .dog-prop.catching .paw-front { animation: paw-grab .55s ease; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes paw-grab {
    0%   { transform: translate(0,0) rotate(0deg); }
    30%  { transform: translate(-7px,-4px) rotate(-14deg); }
    60%  { transform: translate(2px,2px) rotate(9deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }

  .ball-prop { width: 22px; z-index: 3; border: none; background: none; padding: 0; cursor: grab; touch-action: none;
    transition: left 1s cubic-bezier(.3,.7,.4,1), top 1s cubic-bezier(.3,.7,.4,1), transform .3s ease; }
  .ball-prop.dragging { transition: transform .2s ease; cursor: grabbing; }
  .ball-spin { display: block; }
  .ball-spin.spin { animation: ball-roll .9s linear; }
  @keyframes ball-roll { from { transform: rotate(0deg); } to { transform: rotate(650deg); } }
  .ball-prop svg { display: block; width: 100%; filter: drop-shadow(0 3px 3px rgba(53,48,42,.3)); }

  .clock-btn { width: 72px; height: 72px; border-radius: 50%; background: var(--surface-solid); box-shadow: 0 0 0 5px var(--accent-pink), 0 8px 16px -8px rgba(53,48,42,.4); z-index: 4; }
  .clock-btn::before { content: ''; position: absolute; inset: -16px; border-radius: 50%; background: repeating-conic-gradient(var(--accent-peach) 0deg 9deg, transparent 9deg 27deg); opacity: .4; z-index: -1; }
  .clock-hand { position: absolute; left: 50%; bottom: 50%; width: 3px; background: var(--text-primary); border-radius: 2px; transform-origin: bottom center; }
  .clock-hand.hour { height: 16px; margin-left: -1.5px; }
  .clock-hand.minute { height: 24px; width: 2px; margin-left: -1px; background: var(--accent-pink); }
  .clock-toast { position: absolute; left: 11%; top: 2%; transform: translate(-10%,0) scale(.92); background: var(--surface-solid); color: var(--text-primary);
    padding: 8px 14px; border-radius: 4px; font-family: var(--font-display); font-weight: 500; font-size: .8rem; white-space: nowrap;
    box-shadow: 0 8px 16px -8px rgba(53,48,42,.35); opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease; z-index: 6; }
  .clock-toast.show { opacity: 1; transform: translate(-10%,-10px) scale(1); }

  /* ---- disco ball + rotating light beams ---- */
  .disco-line { position: absolute; left: 50%; top: 0; width: 2px; height: 8%; background: var(--text-muted); transform: translateX(-50%); z-index: 4; }
  .disco-ball { position: absolute; left: 50%; top: 8%; width: 58px; height: 58px; border-radius: 50%; transform: translate(-50%,0); z-index: 4;
    background: conic-gradient(from 0deg, #F0E6D0, #D4C4A0, #F0E6D0, #D4C4A0, #F0E6D0, #D4C4A0);
    box-shadow: inset -8px -8px 12px rgba(53,48,42,.3), 0 10px 16px -6px rgba(53,48,42,.4); animation: disco-spin 7s linear infinite; }
  .disco-ball::before { content:''; position:absolute; top:10%; left:16%; width:34%; height:24%; border-radius:50%; background: rgba(255,255,255,.6); filter: blur(2px); }
  @keyframes disco-spin { to { transform: translate(-50%,0) rotate(360deg); } }

  .disco-rays { position: absolute; left: 50%; top: 9.5%; width: 0; height: 0; pointer-events: none; z-index: 2;
    animation: rays-spin 14s linear infinite; }
  .ray-beam { position: absolute; left: -3px; top: 0; width: 6px; height: 640px; transform-origin: top center; opacity: .3; }
  @keyframes rays-spin { to { transform: rotate(360deg); } }

  /* ---- window with cityscape ---- */
  .window-frame { position: absolute; width: 160px; z-index: 3; }
  .window-glass { position: relative; width: 100%; height: 104px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 6px var(--surface-solid), 0 8px 16px -8px rgba(53,48,42,.35); }
  .window-glass::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--surface-solid); margin-left: -2px; z-index: 3; }
  .window-glass::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 4px; background: var(--surface-solid); margin-top: -2px; z-index: 3; }
  .sky { position: absolute; inset: 0; transition: background .6s ease; }
  .sky-body { position: absolute; border-radius: 50%; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #FFFDF6; opacity: .85; }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; }
  .skyline svg { width: 100%; height: 100%; display: block; }
  .window-arrow { position: absolute; top: 50%; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-solid); border: none;
    box-shadow: 0 3px 6px rgba(53,48,42,.3); cursor: pointer; font-size: 1rem; color: var(--text-primary); transform: translateY(-50%); }
  .window-arrow.left { left: -30px; } .window-arrow.right { right: -30px; }
  .window-label { margin-top: 8px; text-align: center; font-family: var(--font-display); font-weight: 500; font-size: .8rem; color: var(--text-primary);
    background: var(--surface-solid); border-radius: 4px; padding: 4px 10px; box-shadow: 0 3px 6px rgba(53,48,42,.2); }

  /* ---- growing plant ---- */
  .plant-pot { position: absolute; width: 50px; }
  .plant-pot svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* ---- weather: seasonal particles ---- */
  .weather-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 7; }
  .weather-particle { position: absolute; top: -8%; border-radius: 50%; animation-timing-function: linear; animation-iteration-count: infinite; }
  .weather-particle.leaf { border-radius: 0 60% 0 60%; }
  .weather-particle.petal { border-radius: 100% 0 100% 0; }
  @keyframes weather-fall { 0% { top: -8%; opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } 100% { top: 106%; opacity: 0; } }
  @keyframes weather-rise { 0% { top: 106%; opacity: 0; } 12% { opacity: .8; } 88% { opacity: .8; } 100% { top: -8%; opacity: 0; } }
  @keyframes weather-sway { 0% { margin-left: -6px; } 100% { margin-left: 6px; } }

  /* ---- birthday countdown plaque ---- */
  .bday-countdown { position: absolute; background: var(--surface-solid); border-radius: 4px; padding: 7px 12px; font-family: var(--font-display);
    font-weight: 500; font-size: .7rem; color: var(--text-primary); box-shadow: 0 6px 12px -6px rgba(53,48,42,.3); text-align: center; line-height: 1.3; white-space: nowrap; z-index: 4; }

  /* ---- radio ---- */
  .radio-prop { width: 62px; height: 42px; z-index: 3; }
  .wall-shelf { position: absolute; width: 150px; height: 8px; z-index: 2; }
  .wall-shelf-plank { position: absolute; left: 0; right: 0; top: 0; height: 8px; border-radius: 5px; background: linear-gradient(160deg, #E8CFA0, #D1AC7C); box-shadow: 0 8px 14px -6px rgba(53,48,42,.4); }
  .wall-shelf-bracket { position: absolute; width: 4px; height: 12px; background: #C2A176; bottom: -12px; }
  .wall-shelf-bracket.l { left: 18%; } .wall-shelf-bracket.r { right: 18%; }
  .radio-body { position: absolute; inset: 0; border-radius: 8px; background: linear-gradient(160deg, #C9A375, #96754D); box-shadow: 0 10px 16px -8px rgba(53,48,42,.5); }
  .radio-dial { position: absolute; left: 8px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface-solid); box-shadow: inset 0 0 0 2px var(--accent-lavender); }
  .radio-grill { position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; border-radius: 4px;
    background-image: radial-gradient(circle, var(--text-muted) 1.2px, transparent 1.4px); background-size: 6px 6px; opacity: .6; }
  .radio-antenna { position: absolute; right: 14px; top: -14px; width: 2px; height: 16px; background: var(--text-muted); transform: rotate(18deg); transform-origin: bottom center; }
  .radio-prop.playing .radio-dial { box-shadow: inset 0 0 0 2px var(--accent-pink); animation: orb-pulse 1.6s ease-in-out infinite; }

  /* ---- armchair with plush dino ---- */
  .armchair { position: absolute; width: 130px; height: 112px; z-index: 3; }
  .chair-back { position: absolute; left: 8%; right: 8%; top: 0; height: 58%; border-radius: 10px 10px 4px 4px; background: linear-gradient(160deg, var(--accent-pink), #4A1220); box-shadow: 0 10px 20px -10px rgba(53,48,42,.35); }
  .chair-seat { position: absolute; left: 0; right: 0; bottom: 20%; height: 34%; border-radius: 8px; background: linear-gradient(160deg, var(--accent-pink), #5C1F2E); box-shadow: 0 8px 16px -8px rgba(53,48,42,.3); }
  .chair-arm { position: absolute; bottom: 16%; width: 18px; height: 48%; border-radius: 6px; background: var(--accent-pink); }
  .chair-arm.l { left: -3%; } .chair-arm.r { right: -3%; }
  .chair-leg { position: absolute; bottom: -12px; width: 8px; height: 30px; background: var(--accent-peach); border-radius: 2px; }
  .chair-leg.l { left: 16%; } .chair-leg.r { right: 16%; }
  .chair-dino { position: absolute; left: 52%; top: -6%; transform: translateX(-50%); width: 92px; filter: drop-shadow(0 6px 6px rgba(53,48,42,.3)); border: none; background: none; padding: 0; cursor: pointer; }
  .chair-dino svg { display: block; width: 100%; height: auto; }
  .chair-dino .tongue { opacity: 0; transform-origin: 70px 63px; transition: opacity .15s ease; }
  .chair-dino.tongue-out .tongue { opacity: 1; animation: tongue-wag .7s cubic-bezier(.34,1.56,.64,1) 1; }
  @keyframes tongue-wag {
    0% { transform: scaleY(0) rotate(0deg); }
    35% { transform: scaleY(1.12) rotate(-10deg); }
    55% { transform: scaleY(1) rotate(9deg); }
    75% { transform: scaleY(1) rotate(-5deg); }
    100% { transform: scaleY(1) rotate(0deg); }
  }
  .chair-dino .mouth-open { opacity: 0; transition: opacity .12s ease; }
  .chair-dino.tongue-out .mouth-open { opacity: 1; }
  .chair-dino.tongue-out .mouth-closed { opacity: 0; }
  .chair-dino.bop { animation: dino-bop .4s ease; }
  @keyframes dino-bop { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.08,0.92); } 100% { transform: translateX(-50%) scale(1); } }
  .chair-pillow { position: absolute; left: 16%; top: 34%; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-pink);
    box-shadow: 15px 3px 0 -2px var(--accent-pink), -12px 5px 0 -3px var(--accent-pink), 3px -9px 0 -4px var(--accent-pink), 7px 9px 0 -3px var(--accent-pink); }

  /* ---- shared prop button reset ---- */
  .prop { position: absolute; border: none; padding: 0; cursor: pointer; background: none; }
  .prop:hover { filter: brightness(1.06); }

  /* ---- contact shadow, reused under standalone props ---- */
  .floor-shadow { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); width: 68%; height: 10px; border-radius: 50%;
    background: rgba(53,48,42,.26); filter: blur(4px); z-index: -1; pointer-events: none; }
  .floor-shadow.big { width: 84%; height: 14px; bottom: -16px; }

  /* ---- congratulations: stacked, draggable boxes ---- */
  .gift-prop { width: 70px; height: 80px; touch-action: none; z-index: 5; }
  .gift-prop .box-lid { position: absolute; left: -6%; right: -6%; top: 0; height: 26%; border-radius: 6px; background: var(--box-color); filter: brightness(0.86); box-shadow: 0 3px 6px rgba(53,48,42,.25); }
  .gift-prop .box-body { position: absolute; left: 0; right: 0; top: 22%; bottom: 0; border-radius: 0 0 10px 10px; background: var(--box-color); box-shadow: 0 10px 18px -10px rgba(53,48,42,.5); }
  .gift-prop .ribbon-v { position: absolute; top: 0; bottom: 0; left: 50%; width: 8px; margin-left: -4px; background: var(--surface-solid); opacity: .92; z-index: 2; }
  .gift-prop .ribbon-h { position: absolute; left: 0; right: 0; top: 22%; height: 7px; background: var(--surface-solid); opacity: .92; z-index: 2; }
  .gift-prop .bow { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent-peach); box-shadow: 0 2px 4px rgba(53,48,42,.3), inset 0 0 0 2px var(--surface-solid); z-index: 3; }
  .gift-prop.opened { opacity: .55; }
  .gift-prop.dragging { filter: brightness(1.1); cursor: grabbing; }
  .gift-prop.pop { animation: prop-pop .4s ease; }
  @keyframes prop-pop {
    0% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1); }
    50% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.18); }
    100% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1); }
  }

  /* ---- table + cake ---- */
  .table-assembly { position: absolute; width: 140px; height: 155px; }
  .stand-foot { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 30px; height: 8px; border-radius: 50%;
    background: linear-gradient(160deg, #6B4A32, #4A3220); box-shadow: 0 4px 8px -3px rgba(53,48,42,.4); z-index: 1; }
  .stand-pedestal { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 34px; height: 58px;
    background: linear-gradient(160deg, #7A5638, #4A3220);
    clip-path: polygon(34% 0%, 66% 0%, 100% 46%, 100% 54%, 66% 100%, 34% 100%, 0% 54%, 0% 46%); z-index: 1; }
  .stand-plate { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); width: 112px; height: 13px; border-radius: 50%; z-index: 2;
    background: var(--surface-solid); box-shadow: 0 10px 16px -8px rgba(53,48,42,.4), inset 0 -3px 4px rgba(53,48,42,.08); }
  .stand-plate::after { content: ''; position: absolute; left: 4%; right: 4%; top: 1px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.7); }

  .cake { position: absolute; left: 50%; bottom: 68px; transform: translateX(-50%); width: 88px; z-index: 3; }
  .candles { position: absolute; top: -20px; left: 0; right: 0; height: 20px; display: flex; justify-content: center; align-items: flex-end; gap: 5px; }
  .candle { position: relative; width: 4px; height: 100%; background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; }
  .candle .stick { width: 4px; height: 15px; border-radius: 1.5px; box-shadow: 0 1px 2px rgba(53,48,42,.3); }
  .candle .flame { width: 6px; height: 9px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); transform-origin: bottom center; margin-bottom: -1px;
    background: radial-gradient(circle at 30% 30%, #FFF3C4, #FFB347 55%, #E8752C 100%); animation: flicker 1.3s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { transform: rotate(-45deg) scale(1); } 50% { transform: rotate(-38deg) scale(0.9,1.08); } }
  .candle.out .flame { animation: none; opacity: 0; transform: rotate(-45deg) scale(0.2); transition: opacity .4s ease, transform .4s ease; }
  .candle .smoke { position: absolute; top: -1px; width: 4px; height: 4px; border-radius: 50%; background: rgba(140,130,150,.4); opacity: 0; }
  .candle.out .smoke { animation: smoke-puff 1s ease-out forwards; }
  @keyframes smoke-puff { 0% { opacity:.6; transform:translateY(0) scale(1);} 100% { opacity:0; transform:translateY(-14px) scale(2.2);} }

  .tier { border-radius: 16px; position: relative; }
  .tier.main { height: 46px; border-radius: 22px 22px 8px 8px; background: linear-gradient(160deg, #F9D5E4, #F0A8C4); box-shadow: 0 6px 10px -5px rgba(53,48,42,.3); overflow: visible; }
  .sprinkle { position: absolute; border-radius: 50%; }
  .frosting { position: absolute; top: -6px; left: 0; right: 0; height: 11px; background-image: radial-gradient(circle at 5.5px 5.5px, #FFFDF8 4.5px, transparent 5px); background-size: 11px 11px; background-repeat: repeat-x; }
  .frosting-bottom { position: absolute; bottom: -4px; left: 0; right: 0; height: 7px; background-image: radial-gradient(circle at 3.5px 3.5px, #F5BBD3 3px, transparent 3.5px); background-size: 7px 7px; background-repeat: repeat-x; }
  .plate { width: 112%; margin-left: -6%; height: 7px; border-radius: 50%; background: var(--surface-solid); box-shadow: 0 5px 10px -4px rgba(53,48,42,.4); margin-top: 2px; }
  .cake-shadow { position: absolute; left: 50%; bottom: -3px; transform: translateX(-50%); width: 78%; height: 6px; border-radius: 50%; background: rgba(53,48,42,.28); filter: blur(2px); z-index: -1; }

  /* ---- camera ---- */
  .camera { width: 96px; height: 74px; z-index: 4; }
  .cam-body { position: absolute; left: 4px; right: 4px; bottom: 10px; top: 20px; background: linear-gradient(160deg, var(--accent-pink), #4A1220); border-radius: 10px; box-shadow: 0 10px 18px -10px rgba(53,48,42,.5); }
  .cam-body::after { content:''; position:absolute; left:0; right:0; bottom:0; height: 40%; background: var(--text-primary); opacity:.8; border-radius: 0 0 10px 10px; }

  .fortune-label { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 500; font-size: .62rem; color: var(--surface-solid); letter-spacing: .01em; }

  .modal-close { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; line-height: 1; padding: 6px; }

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const room = document.getElementById('room');
  const roomScroll = document.getElementById('room-scroll');
  const swipeHint = document.getElementById('swipe-hint');
  if (roomScroll && swipeHint) {
    roomScroll.addEventListener('scroll', () => swipeHint.classList.add('hide'), { once: true });
  }
  const today = new Date();

  // ---------- сезон: погода за окном и в комнате ----------
  function getSeason(month) {
    if (month === 11 || month === 0 || month === 1) return 'winter';
    if (month >= 2 && month <= 4) return 'spring';
    if (month >= 5 && month <= 7) return 'summer';
    return 'autumn';
  }
  const seasonConfigs = {
    winter: { count: 22, colors: ['#FFFFFF', '#FFF6D6'], shape: 'circle', size: [3, 5], behavior: 'fall', duration: [9, 16] },
    spring: { count: 16, colors: ['#E3A8B8', '#FFFCF0', '#C1DBE8'], shape: 'petal', size: [5, 8], duration: [10, 18], behavior: 'fall' },
    summer: { count: 14, colors: ['#E8C888', '#F5DFA8'], shape: 'circle', size: [2, 4], duration: [7, 13], behavior: 'rise' },
    autumn: { count: 16, colors: ['#7A2B3D', '#C7A968', '#A9C4CE'], shape: 'leaf', size: [6, 9], duration: [9, 15], behavior: 'fall' }
  };
  const season = getSeason(today.getMonth());
  if (!reduceMotion) {
    const cfg = seasonConfigs[season];
    const layer = document.getElementById('weather-layer');
    for (let i = 0; i < cfg.count; i++) {
      const p = document.createElement('div');
      p.className = 'weather-particle ' + cfg.shape;
      const size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
      p.style.width = size + 'px'; p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
      if (cfg.shape === 'petal' || cfg.shape === 'leaf') p.style.transform = `rotate(${Math.random() * 360}deg)`;
      const dur = cfg.duration[0] + Math.random() * (cfg.duration[1] - cfg.duration[0]);
      const delay = -Math.random() * dur;
      const swayDur = 2 + Math.random() * 2;
      p.style.animation = `${cfg.behavior === 'rise' ? 'weather-rise' : 'weather-fall'} ${dur}s linear infinite ${delay}s, weather-sway ${swayDur}s ease-in-out infinite alternate`;
      layer.appendChild(p);
    }
  }

  // ---------- обратный отсчёт до дня рождения (12 сентября) ----------
  function ruDays(n) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'день';
    if ([2, 3, 4].includes(mod10) && ![12, 13, 14].includes(mod100)) return 'дня';
    return 'дней';
  }
  (function renderCountdown() {
    const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let target = new Date(t0.getFullYear(), 8, 12);
    if (target < t0) target = new Date(t0.getFullYear() + 1, 8, 12);
    const diff = Math.round((target - t0) / 86400000);
    const el = document.getElementById('bday-countdown');
    el.textContent = diff === 0 ? '🎂 сегодня ДР!' : `🎂 до ДР — ${diff} ${ruDays(diff)}`;
  })();

  // ---------- растение на подоконнике: растёт раз в день ----------
  (function renderPlant() {
    const key = 'liza-room-plant';
    const todayStr = today.toISOString().slice(0, 10);
    let stage = 0;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (saved && saved.lastDate === todayStr) {
        stage = saved.stage;
      } else {
        stage = saved ? Math.min(saved.stage + 1, 5) : 0;
        localStorage.setItem(key, JSON.stringify({ stage, lastDate: todayStr }));
      }
    } catch (e) {}

    const stemHeights = [0, 8, 16, 24, 30, 34];
    const leafCounts = [0, 1, 2, 3, 3, 4];
    const h = stemHeights[stage], leaves = leafCounts[stage];
    let leavesSvg = '';
    for (let i = 0; i < leaves; i++) {
      const y = 46 - (h / leaves) * (i + 0.6);
      const side = i % 2 === 0 ? 1 : -1;

    openModal(`<h3>Видоискатель</h3><p>Запрашиваем доступ к камере...</p>`);

  function capturePhoto() {
    const video = document.getElementById('cam-video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 480; canvas.height = video.videoHeight || 600;
    const ictx = canvas.getContext('2d');
    ictx.translate(canvas.width, 0); ictx.scale(-1, 1);
    ictx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/png');
    stopStream();
    flashOverlay.classList.remove('flash'); void flashOverlay.offsetWidth; flashOverlay.classList.add('flash');
    const caption = captions[Math.floor(Math.random() * captions.length)];
    openModal(`<div class="polaroid" style="background-image:url('${dataUrl}');background-size:cover;background-position:center;"></div>
      <p>${caption}</p>
      <div class="modal-actions">
        <button class="secondary" id="retake-btn">переснять</button>
        <a class="primary" id="download-btn" href="${dataUrl}" download="liza-photo.png">скачать</a>
      </div>`);
    document.getElementById('retake-btn').addEventListener('click', openCamera);
  }

  function simulatePhoto() {
    flashOverlay.classList.remove('flash'); void flashOverlay.offsetWidth; flashOverlay.classList.add('flash');
    const caption = captions[Math.floor(Math.random() * captions.length)];
    openModal(`<div class="polaroid">📸✨🎉</div><p>${caption}</p>
      <div class="modal-actions"><button class="secondary" id="retake-btn">ещё снимок</button></div>`);
    document.getElementById('retake-btn').addEventListener('click', openCamera);
  }

  document.getElementById('camera-btn').addEventListener('click', openCamera);

  // ---------- предсказание: отдых, большие дела, путешествия ----------
  const fortunes = [
    'Этим летом обязательно будет город, в который давно хотелось, но всё не находилось повода',
    'Пора наконец выключить телефон на целые выходные — и мир не рухнет',
    'Один билет в один конец приведёт к лучшей идее года',
    'Ты возьмёшься за то самое большое дело, которое казалось слишком масштабным ещё в январе',
    'Где-то далеко тебя ждёт вид, ради которого стоит проснуться в пять утра',
    'Отпуск в этом году будет длиннее, чем ты обычно себе разрешаешь',
    'Случится путешествие, после которого захочется переставить мебель дома',
    'Ты наконец доделаешь тот масштабный проект для себя, а не для работы',
    'Будет утро без будильника, которое запомнится на весь год',
    'Новая страна на карте — и совсем новый взгляд на привычные вещи'
  ];
  const orbBtn = document.getElementById('orb-btn');
  function dayOfYear(d) {
    const start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }
  function askOrb() {
    orbBtn.classList.remove('active'); void orbBtn.offsetWidth; orbBtn.classList.add('active');
    const idx = dayOfYear(today) % fortunes.length;
    const dateStr = today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    setTimeout(() => {
      openModal(`<h3>Предсказание на ${dateStr}</h3><p id="fortune-text"></p>
        <p style="margin-top:14px; color: var(--text-muted); font-size:.85rem;">новое появится завтра</p>`);
      typewrite(document.getElementById('fortune-text'), fortunes[idx]);
    }, reduceMotion ? 0 : 450);
  }
  orbBtn.addEventListener('click', askOrb);

  function typewrite(el, text) {
    let i = 0; const speed = reduceMotion ? 0 : 22;
    function step() { if (i <= text.length) { el.textContent = text.slice(0, i); i++; if (speed > 0) setTimeout(step, speed); else step(); } }
    step();
  }

  // ---------- торт: обсыпка + разноцветные свечи ----------
  const sprinkleColors = ['#F6B8D2', '#B4D8F0', '#FFE29A', '#B8E0C8', '#D9B3E8', '#F5A3A3', '#FFD37A', '#FFFDF8'];
  const cakeTier = document.getElementById('cake-tier');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'sprinkle';
    const size = 2 + Math.random() * 1.8;
    s.style.width = size + 'px'; s.style.height = size + 'px';
    s.style.left = (6 + Math.random() * 88) + '%';
    s.style.top = (12 + Math.random() * 76) + '%';
    s.style.background = sprinkleColors[Math.floor(Math.random() * sprinkleColors.length)];
    cakeTier.appendChild(s);
  }

  const candleColors = ['#F6B8D2', '#B4D8F0', '#FFE29A', '#B8E0C8', '#D9B3E8', '#F5A3A3', '#FFD37A', '#C9A8E8'];
  const candlesWrap = document.getElementById('candles');
  const candleCount = 5;
  let litCount = candleCount;
  let celebrated = false;
  for (let i = 0; i < candleCount; i++) {
    const btn = document.createElement('button');
    btn.className = 'candle';
    btn.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-label', 'задуть свечу');
    btn.innerHTML = '<span class="flame"></span><span class="smoke"></span><span class="stick" style="background:' + candleColors[i % candleColors.length] + '"></span>';
    btn.addEventListener('click', () => extinguish(btn));
    candlesWrap.appendChild(btn);
  }
  function extinguish(btn) {
    if (btn.classList.contains('out')) return;
    btn.classList.add('out'); btn.setAttribute('aria-pressed', 'true');
    litCount--; if (litCount <= 0) celebrate();
  }
  document.getElementById('blow-all-btn').addEventListener('click', () => {
    const remaining = candlesWrap.querySelectorAll('.candle:not(.out)');
    remaining.forEach((c, i) => setTimeout(() => extinguish(c), i * 150));
  });
  function celebrate() {
    if (celebrated) return; celebrated = true;
    launchConfetti();
    setTimeout(() => { openModal(`<h3>Загадала?</h3><p>Спасибо, что ты рядом. С днём рождения, Лиза — пусть этот год будет таким же смелым, как ты.</p>`); }, 500);
  }

  // ---------- конфетти ----------
  const confettiCanvas = document.getElementById('confetti-canvas');
  const cctx = confettiCanvas.getContext('2d');
  let confettiPieces = []; let confettiRunning = false;
  function sizeConfettiCanvas() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
  window.addEventListener('resize', sizeConfettiCanvas); sizeConfettiCanvas();
  const confettiColors = ['#7A2B3D', '#C1DBE8', '#E8C888', '#A9C4CE'];
  function launchConfetti() {
    confettiPieces = Array.from({ length: reduceMotion ? 0 : 160 }, () => ({
      x: Math.random() * confettiCanvas.width, y: -20 - Math.random() * confettiCanvas.height * 0.4,
      w: Math.random() * 6 + 4, h: Math.random() * 10 + 6, speed: Math.random() * 2 + 1.5,
      drift: (Math.random() - 0.5) * 1.2, rot: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 0.15,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)]
    }));
    confettiRunning = true; animateConfetti();
  }
  function animateConfetti() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let anyVisible = false;
    confettiPieces.forEach(p => {
      p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
      if (p.y < confettiCanvas.height + 20) anyVisible = true;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.fillStyle = p.color; cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cctx.restore();
    });
    if (anyVisible && confettiRunning) requestAnimationFrame(animateConfetti);
    else cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }
</script>
</body>
</html>
